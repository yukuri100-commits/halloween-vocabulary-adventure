<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Halloween · A Vocabulary Adventure</title>
  <meta name="description" content="探索魔法萬聖夜，找到十個角色，欣賞圖文單字卡、聆聽英文發音！">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23171227'/%3E%3Ctext x='8' y='49' font-size='46'%3E🎃%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css"><script src="app.js" defer></script><script src="pets.js" defer></script><script src="mummy.js" defer></script><script src="werewolf.js" defer></script><script src="vampire.js" defer></script><script src="encounters.js" defer></script>
  <style>
    /* A self-contained home link; the scene and vocabulary scripts stay unchanged. */
    .halloween-home {
      position: fixed;
      right: max(16px, env(safe-area-inset-right, 0px));
      bottom: max(16px, env(safe-area-inset-bottom, 0px));
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      width: 76px;
      height: 80px;
      border: 2px solid #ffd48a;
      border-radius: 22px;
      background: #251b36;
      color: #fff2d6;
      box-shadow: 0 4px 18px #100b20a6, inset 0 0 14px #ffae3826;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      line-height: 16px;
      touch-action: manipulation;
      user-select: none;
      transition: background .18s, box-shadow .18s;
    }
    .halloween-home svg {
      display: block;
      width: 48px;
      height: 48px;
      flex: none;
      pointer-events: none;
    }
    @media (hover: hover) {
      .halloween-home:hover {
        background: #43304d;
        box-shadow: 0 4px 22px #ffb54166, inset 0 0 14px #ffae3826;
      }
    }
    .halloween-home:active { background: #513649; }
    .halloween-home:focus-visible {
      outline: 4px solid #fff2b9;
      outline-offset: 4px;
      box-shadow: 0 0 0 8px #251b36;
    }
    @media (max-width: 640px), (max-height: 600px) {
      .halloween-home {
        right: max(12px, env(safe-area-inset-right, 0px));
        bottom: max(12px, env(safe-area-inset-bottom, 0px));
        width: 64px;
        height: 68px;
        border-radius: 18px;
        gap: 0;
        font-size: 12px;
      }
      .halloween-home svg { width: 42px; height: 42px; }
    }
    /* On short landscape screens, reserve a side lane away from every hotspot. */
    @media (max-height: 520px) and (min-aspect-ratio: 4/3) {
      body > main { padding-right: max(88px, calc(76px + env(safe-area-inset-right, 0px))); }
      main > .scene-shell {
        width: min(100%, calc(100vh * 1672 / 941));
        width: min(100%, calc(100dvh * 1672 / 941));
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .halloween-home { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <section class="scene-shell" aria-label="萬聖節單字探索遊戲">
      <div class="scene" id="scene">
        <img class="background" src="assets/scene-bats-clean.png" width="1672" height="941" alt="月光下的萬聖節村莊：女巫飛過城堡，吸血鬼、木乃伊、狼人與骷髏在南瓜小徑上玩耍。" draggable="false">
        <div id="atmosphere" class="atmosphere" aria-hidden="true"></div>
        <div id="hotspots"></div>
      </div>
      <a class="halloween-home" href="https://yukuri100-commits.github.io/vampire-haunted-night/" aria-label="返回萬聖節主網頁（首頁）" title="返回萬聖節主網頁">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
          <path d="M33 17c-2-7 0-12 5-14l5 4c-5 0-7 4-6 10" fill="#8bad59" stroke="#233327" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M36 12c7-7 14-5 16-2-6 5-11 6-16 2" fill="#b4cf77"/>
          <path d="M32 17C10 8 3 29 7 43c3 12 15 17 25 13 10 4 22-1 25-13 4-14-3-35-25-26Z" fill="#f99836" stroke="#713b29" stroke-width="2.5"/>
          <path d="M24 19c-10 9-12 25-3 34M40 19c10 9 12 25 3 34" fill="none" stroke="#d96a29" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M16 34 32 21l16 13" fill="none" stroke="#fff0c2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M21 33v17h22V33L32 24Z" fill="#fff0c2" stroke="#713b29" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M28 50V39a4 4 0 0 1 8 0v11" fill="#473044"/>
          <circle cx="33" cy="44" r="1.2" fill="#ffcf70"/>
          <circle cx="14" cy="40" r="2" fill="#ffcb82"/>
          <circle cx="50" cy="40" r="2" fill="#ffcb82"/>
          <path d="m52 19 1-3m3 6 3-1" fill="none" stroke="#ffdd86" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span>首頁</span>
      </a>
    </section>
  </main>
  <dialog id="card" aria-labelledby="word"><div class="card-inner">
    <h2 id="word" class="visually-hidden" lang="en"></h2>
    <img id="card-image" class="vocabulary-art" alt="">
    <div class="vocabulary-controls"><button class="close" id="close" aria-label="關閉單字卡">×</button>
      <div class="card-actions"><button id="listen" class="primary">🔊 Listen</button><button id="continue" class="continue">繼續探索 →</button></div>
      <p id="speech-status" class="speech-status" role="status">按 Listen 聆聽單字發音。</p>
    </div>
  </div></dialog>
  <dialog id="celebration" aria-labelledby="celebration-title"><div class="celebration-inner"><p class="eyebrow">TWELVE DISCOVERIES. ONE MAGICAL NIGHT.</p><div class="celebration-icon">🎃</div><h2 id="celebration-title">HAPPY<br>HALLOWEEN!</h2><p>你找到了全部 12 個單字！<br>今晚，你就是最棒的單字探險家。</p><div class="celebration-stars">✦ ✧ ✦</div><button id="explore-again" class="primary">再玩一次</button><button id="review" class="continue">回到場景複習 →</button></div></dialog>
</body>
</html>
